name: README feeds

on:
  schedule:
    # Once a day; posts and projects change at most a few times a week.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Projects
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://www.alvaldes.dev/en/works/rss.xml"
          comment_tag_name: "PROJECT-LIST"
          max_post_count: 5
          # Projects have no publish date: keep the order of the portfolio's Works page.
          disable_sort: true
          disable_item_validation: true
          template: "- **[$title]($url)**: $description $newline"
          commit_message: "docs: update the projects"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Latest blog posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://www.alvaldes.dev/en/rss.xml"
          max_post_count: 5
          template: "- [$title]($url): $description $newline"
          commit_message: "docs: update the latest blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
