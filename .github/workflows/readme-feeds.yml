name: README feeds

on:
  schedule:
    # Once a day; posts and projects change at most a few times a week.
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/readme-feeds.yml"]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the renderer
        run: node --test 'scripts/*.test.mjs'

      # Project and blog cards from the portfolio's RSS feeds (scripts/readme-feeds.mjs).
      - name: Render the feeds
        run: node scripts/readme-feeds.mjs

      - name: Commit the README when it changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: update the project and blog cards"
          git push
